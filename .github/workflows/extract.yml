name: Extract ZIP to repo

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'שם קובץ ה-ZIP בריפו (למשל: kulyacholandro-v2.zip)'
        required: true
        default: 'kulyacholandro-v2.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o "${{ github.event.inputs.zip_name }}"
          ZIP_DIR=$(unzip -Z1 "${{ github.event.inputs.zip_name }}" | head -1 | cut -d/ -f1)
          if [ -d "$ZIP_DIR" ] && [ "$ZIP_DIR" != "." ]; then
            cp -r "$ZIP_DIR"/. .
            rm -rf "$ZIP_DIR"
          fi
          rm "${{ github.event.inputs.zip_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from ZIP"
          git push
