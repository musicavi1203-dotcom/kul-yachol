name: Extract ZIP to repo

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'שם קובץ ה-ZIP בריפו (למשל: kulyacholandro-v4.zip)'
        required: true
        default: 'kulyacholandro-v4.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "${{ github.event.inputs.zip_name }}"

      - name: Remove ZIP
        run: rm "${{ github.event.inputs.zip_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project from ZIP"
          git push
